# Item rules live here. /statlog reload applies edits to existing rules.
# Each tier activates while the player's stat is BELOW required_level.
# For the same item and stat, only the closest unmet level activates.
# Add any number of tiers. You can put multiple actions at the same level.
# Different stats and equipped items stack their penalties.
# The examples below are disabled until you remove the # from each line.

# [[tiers]]
# item = "minecraft:netherite_sword"
# stat = "strength"
# required_level = 5
# type = "UNUSABLE"

# [[tiers]]
# item = "minecraft:netherite_sword"
# stat = "strength"
# required_level = 10
# type = "PLAYER_ATTRIBUTE"
# target = "minecraft:generic.attack_speed"
# amount = -0.5 # 50% slower while equipped

# [[tiers]]
# item = "minecraft:netherite_sword"
# stat = "strength"
# required_level = 15
# type = "PLAYER_ATTRIBUTE"
# target = "minecraft:generic.attack_speed"
# amount = -0.25

# Other actions you can use at any tier:
# type = "EFFECT" needs target = "minecraft:slowness" and amplifier = 0 (level I).
# type = "ITEM_DAMAGE" needs multiplier = 0.5 (half melee damage with this item).
# type = "ITEM_MINING_SPEED" needs multiplier = 0.5 (half mining speed with this item).
# type = "UNUSABLE" needs no other fields.

# Restrictions can match an exact item/block or a #tag. Add several actions to
# one rule. If both item and block are set, both must match. The message appears
# in the action bar when the player is below required_level. Placeholders:
# {stat}, {level}, {required}. Leave message out for a silent restriction.
# [[tiers]]
# type = "RESTRICT"
# block = "#minecraft:doors"
# actions = ["USE_BLOCK", "BREAK_BLOCK", "PLACE_BLOCK"]
# stat = "strength"
# required_level = 5
# message = "You need Strength {required} to use this door."
# Other actions: USE_ITEM, EAT, ATTACK_ENTITY, INTERACT_ENTITY.
