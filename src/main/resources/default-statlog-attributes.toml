# Statlog attributes and tabs. Run /statlog reload after editing this file.
# XP is built in. Add custom currencies here, then give each a display name and color.
custom_points = ["POWER", "ENDURANCE"]

[point_names]
POWER = "Power"
ENDURANCE = "Endurance"

[point_colors]
POWER = "#FF7777"
ENDURANCE = "#77CCFF"

# Tab order: first six appear below the panel, right to left. The next five
# appear above it, left to right. The edit button reserves the sixth top slot.
[[attribute_tabs]]
id = "combat"
name = "Combat"
item = "minecraft:iron_sword"
texture = "combat.png"

[[attribute_tabs]]
id = "survival"
name = "Survival"
item = "minecraft:book"
texture = "survival.png"

[[attribute_tabs]]
id = "utility"
name = "Utility"
item = "minecraft:compass"
texture = "utility.png"

# Only listed attributes appear in Statlog. key is the short name for commands
# and KubeJS. If omitted, a key is derived from name. Keep keys unique and stable.
# Defaults per stat: min_level = 0, max_level = 10, starting_level = min_level,
# increment_value = 1.0, cost = 1, currency = "XP".
# For multiple tabs use tabs = ["combat", "survival"] instead of tab.
# Optional: max_icon = false, max_icon_sepia = false.
# The generated icon files are in config/statlog/icons/assets/statlog/textures/gui/attributes/.
# name, description, tab names, and currency names may be translation keys from
# config/statlog/lang/en_us.json, for example name = "statlog.attribute.strength".
# For display-only stats use statlog:empty/your_key so each has a unique ID.
# Extra attributes use their own increment_value and optional level_values = ["5:4"].

[[listed_attributes]]
attribute = "minecraft:generic.max_health"
key = "health"
name = "Health"
description = "Increases your maximum health."
icon = "health.png"
tabs = ["combat", "survival", "utility"]

[[listed_attributes]]
attribute = "minecraft:generic.attack_damage"
key = "strength"
name = "Strength"
description = "Increases your attack damage."
icon = "strength.png"
tab = "combat"
increment_value = 0.2

[[listed_attributes]]
attribute = "minecraft:generic.movement_speed"
key = "speed"
name = "Speed"
description = "Increases your movement speed."
icon = "speed.png"
tab = "utility"
increment_value = 0.01
max_level = 5

[[listed_attributes]]
attribute = "puffish_attributes:stamina"
key = "stamina"
name = "Stamina"
description = "Increases your stamina capacity."
icon = "stamina.png"
tab = "survival"

[[listed_attributes]]
attribute = "minecraft:generic.armor"
key = "armor"
name = "Armor"
description = "Increases your armor rating."
icon = "defense.png"
tab = "survival"
increment_value = 0.5
current_text = "Armor {1}, Toughness {2}"
increment_text = "Per level: {1} Armor, {2} Toughness"

[[listed_attributes.extra_attributes]]
attribute = "minecraft:generic.armor_toughness"
increment_value = 0.25

[[listed_attributes]]
attribute = "minecraft:generic.attack_speed"
key = "attack_speed"
name = "Attack Speed"
description = "Increases attack speed and shortens enemy invulnerability after a hit."
icon = "attack_speed.png"
tab = "combat"
increment_value = 0.1
current_text = "Attack speed {1}, immunity change {2}"
increment_text = "Next: {1} attack speed, {2} immunity ticks"

[[listed_attributes.extra_attributes]]
attribute = "statlog:target_invulnerability_ticks"
increment_value = -0.6

[[listed_attributes]]
attribute = "minecraft:generic.knockback_resistance"
key = "knockback"
name = "Knockback Resistance"
description = "Reduces how far you are knocked back."
icon = "knockback.png"
tab = "combat"
increment_value = 0.05

[[listed_attributes]]
attribute = "minecraft:generic.luck"
key = "luck"
name = "Luck"
description = "Increases your luck."
icon = "luck.png"
tab = "utility"
increment_value = 0.5
